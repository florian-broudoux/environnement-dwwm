services:
  web:
    image: httpd:2.4
    ports:
      - "8080:80"
    volumes:
      - ../portfolio-v5/dist:/usr/local/apache2/htdocs:ro

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3037:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - donnees-mysql:/var/lib/mysql

  adminer:
    image: adminer:6
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  donnees-mysql:
